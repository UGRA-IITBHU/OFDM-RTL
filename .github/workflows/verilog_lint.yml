name: Verilog Lint & Syntax Check

on:
  push:
    branches: [ "main", "qpsk", "**" ]
  pull_request:
    branches: [ "main", "qpsk" ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
          verilator --version

      # The whole tree, testbenches and the AXI wrapper included, elaborates as
      # plain Verilog-2001, so no -g2012 is needed. That matters for FPGA work:
      # Vivado parses .v as Verilog-2001 by default. -I src is required so the
      # bare `include "FFT64.v" &c. inside src/ifft_64.v resolve.
      # full.v lives at the repo root, so it is listed explicitly; every RTL
      # file is include-guarded, so listing src/*.v alongside it is safe.
      - name: Compile and Syntax Check All Modules Together
        run: |
          iverilog -Wall -t null -I src full.v src/*.v fpga/*.v asic/*.v testbenches/*.v

      # Timescale-inheritance warnings are expected and non-fatal: several RTL
      # files predate this repo and carry no `timescale directive.
      - name: Elaborate every testbench
        run: |
          set -e
          iverilog -I src -o /tmp/t.vvp src/zc_seq.v            testbenches/tb_zc_seq.v       && vvp /tmp/t.vvp | grep -q "exited with  0 errors"
          iverilog -I src -o /tmp/t.vvp src/qpsk.v              testbenches/tb_qpsk.v
          iverilog -I src -o /tmp/t.vvp src/qpsk_signal.v src/qpsk_signal_128.v testbenches/tb_QPSK_signal.v
          iverilog -I src -o /tmp/t.vvp src/map_to_subcarriers.v testbenches/tb_subcarrier.v   && vvp /tmp/t.vvp | grep -q "0 ERROR(S)"
          iverilog -I src -o /tmp/t.vvp src/add_cp.v            testbenches/tb_add_cp.v      && vvp /tmp/t.vvp | grep -q "ALL TESTS PASSED"
          iverilog -I src -o /tmp/t.vvp src/ifft_64.v           testbenches/tb_ifft_64.v     && vvp /tmp/t.vvp | grep -q "ALL IFFT TESTS PASSED"
          iverilog -I src -o /tmp/t.vvp src/bit_reversal_buffer.v testbenches/tb_bit_reversal_buffer.v && vvp /tmp/t.vvp | grep -q "ALL BIT-REVERSAL BUFFER TESTS PASSED"
          iverilog -I src -o /tmp/t.vvp full.v                  testbenches/tb_ofdm_frame.v  && vvp /tmp/t.vvp | grep -q "ALL OFDM FRAME TESTS PASSED"
          iverilog -I src -o /tmp/t.vvp full.v                  testbenches/tb_full.v        && vvp /tmp/t.vvp | grep -q "ALL OFDM GENERATE_FRAME TESTS PASSED"
          iverilog -I src -o /tmp/t.vvp full.v fpga/ofdm_axi_lite.v testbenches/tb_ofdm_axi_lite.v && vvp /tmp/t.vvp | grep -q "ALL OFDM AXI-LITE TESTS PASSED"
          iverilog -I src -o /tmp/t.vvp full.v asic/spi_slave_regs.v asic/ofdm_asic_top.v testbenches/tb_ofdm_asic_top.v && vvp /tmp/t.vvp | grep -q "ALL OFDM ASIC TOP TESTS PASSED"

      # Verilator -Wall must be warning-free on all three tops. Note -Isrc with no
      # space: Verilator does not accept "-I src". Intentional warnings are
      # waived inline next to the code they cover (see AGENTS.md); nothing is
      # waived here, so a new warning fails the build.
      - name: Verilator Wall Lint
        run: |
          set -e
          verilator --lint-only -Wall -Isrc --top-module ofdm_generate_frame full.v
          verilator --lint-only -Wall -Isrc --top-module ofdm_axi_lite fpga/ofdm_axi_lite.v full.v
          ASIC_SRC="asic/ofdm_asic_top.v asic/spi_slave_regs.v src/zc_seq.v src/qpsk_signal.v src/qpsk_signal_128.v src/map_to_subcarriers.v src/parallel_to_serial.v src/ifft_64.v"
          verilator --lint-only -Wall -Isrc --top-module ofdm_asic_top $ASIC_SRC
          verilator --lint-only -Wall -Isrc --top-module ofdm_asic_top -GDAC_W=16 -GDAC_DIV=3 -GDAC_OFFSET_BINARY=1 $ASIC_SRC
